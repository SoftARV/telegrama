name: CI image

# Any branch, not just main: workflow_dispatch is only available once a workflow
# is on the default branch, so a main-only trigger cannot bootstrap itself. Note
# that :latest is shared, so a branch editing the Dockerfile replaces the image
# main's CI pulls.
on:
  workflow_dispatch:
  push:
    paths:
      - ci/Dockerfile
      - .github/workflows/ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase paths, and the owner here is SoftARV.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/ci" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ci
          push: true
          tags: ${{ env.IMAGE }}:latest
