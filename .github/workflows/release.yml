name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          tag=$(sha256sum ci/Dockerfile | cut -c1-12)
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/ci:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: probe
        run: |
          if docker manifest inspect "${{ steps.resolve.outputs.ref }}" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.probe.outputs.present == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ci
          push: true
          tags: ${{ steps.resolve.outputs.ref }}

  dist:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # meson dist reads the git history, so this needs the full clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: meson setup build -Dprofile=release

      # A tag that disagrees with meson's version would ship a tarball whose
      # name contradicts the release it hangs off. Introspection needs a
      # configured build directory, so this comes after setup, not before it.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(meson introspect --projectinfo build | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $declared" >&2
            exit 1
          fi


      # Builds and tests the extracted tarball, so this also proves the release
      # compiles from a clean tree rather than only from the working copy.
      - run: meson dist -C build --formats xztar

      # meson writes its own .sha256sum next to the tarball.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            build/meson-dist/*.tar.xz
            build/meson-dist/*.sha256sum

  publish:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Done on the runner rather than in the container, which has no gh.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.xz dist/*.sha256sum
